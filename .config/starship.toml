# $username\
# $hostname\
format = """
$directory\
[](fg:#769ff0)\
$git_branch\
$git_state\
\n$character"""

scan_timeout = 0 # no language information

follow_symlinks = true

add_newline = true

right_format = "$battery"

[package]
disabled = true

[battery]
charging_symbol = ''


[directory]
style = "fg:#1A1B26 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#1A1B26"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#24283b)]($style)'

[username]
style_root = 'bold red'
style_user = 'bold yellow'
style = '[$user]($style) on '

[hostname]
ssh_symbol = '🌐'
aliases = {"Noahs-MacBook-Air" = "Mac"}
style = '[$ssh_symbol$hostname]($style) in '

